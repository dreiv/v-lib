packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@storybook/addon-a11y': 10.6.3
  '@storybook/addon-docs': 10.6.3
  '@storybook/vue3-vite': 10.6.3
  '@types/node': ^24
  '@vitejs/plugin-vue': ^6.0.10
  '@vue/test-utils': ^2.5.1
  jsdom: ^30.1.3
  reka-ui: ~2.11.0
  storybook: 10.6.3
  typescript: ~6.0.2
  unplugin-vue: ^7.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vue: ^3.5.44
  vue-tsc: ^3.3.13
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  esbuild: true
  vue-demi: true
